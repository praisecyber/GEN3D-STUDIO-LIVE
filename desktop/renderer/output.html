<!DOCTYPE html><html><head><meta charset="utf-8"><title>Main output</title>
<style>
html,body{margin:0;height:100%;background:#000 center/cover no-repeat;overflow:hidden;cursor:none}
#bgv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#shade{position:absolute;inset:0;z-index:0;background:#000;pointer-events:none;opacity:0}
#t{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:6vh 8vw;
color:#f6f1e7;font:600 5.2vw/1.3 Georgia,serif;white-space:pre-line;text-shadow:0 2px 10px #000}
body.av #t{padding-left:36vw}
#t{transition:opacity .22s ease, color .2s, background-color .2s;}
#t.fade-in{animation:slideFade .28s ease both}
@keyframes slideFade{from{opacity:.15;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){#t.fade-in{animation:none}#t{transition:none}}
#r{display:none;position:absolute;z-index:1;left:2vw;bottom:0;width:32vw;height:70vh}
body.av #r{display:block}
</style></head><body>
<video id="bgv" loop muted autoplay playsinline></video>
<canvas id="r"></canvas>
<div id="shade"></div><div id="t"></div>
<script type="module">
import { createAvatar } from './dist/avatar.js';
let av = null;
try { av = createAvatar(document.getElementById('r')); } catch (e) { console.error('3D avatar unavailable', e); }
const v = document.getElementById('bgv');
let model='',audioId='',audioWasPlaying=false,projectionVisible=true;const presenterAudio=new Audio();presenterAudio.id='presenter-audio';presenterAudio.hidden=true;document.body.appendChild(presenterAudio);presenterAudio.onended=()=>studio.presenterAudioEnded?.(audioId);presenterAudio.preload='auto';let audioContext=null,analyser=null;const samples=new Float32Array(256);
function animateAudio(){if(analyser&&!presenterAudio.paused){analyser.getFloatTimeDomainData(samples);let sum=0;for(const value of samples)sum+=value*value;av?.setAudioLevel(Math.min(1,Math.sqrt(sum/samples.length)*5));}else av?.setAudioLevel(null);requestAnimationFrame(animateAudio);}animateAudio();
function reportPresenter(message){studio.reportPresenterError?.(message);}
studio.onOutputMode?.(mode=>{projectionVisible=mode!=='production';presenterAudio.muted=!projectionVisible;});
window.addEventListener('beforeunload',()=>{presenterAudio.pause();audioContext?.close();av?.dispose();});
studio.onState(s => {
  if(s.presenterModel!==undefined&&s.presenterModel!==model){model=s.presenterModel;if(model)av?.loadModel(model).catch(()=>reportPresenter('The GLB avatar could not load. Use a self-contained GLB file.'));else av?.resetModel();}
  const cue=s.presenterAudio;if(cue){const newAudio=cue.id!==audioId;if(newAudio){audioId=cue.id;presenterAudio.pause();presenterAudio.src=cue.url;try{audioContext ||= new AudioContext();if(!analyser){analyser=audioContext.createAnalyser();analyser.fftSize=256;const source=audioContext.createMediaElementSource(presenterAudio);source.connect(analyser);analyser.connect(audioContext.destination);}}catch{reportPresenter('Audio-driven presenter animation is unavailable.');}}if(cue.playing&&(newAudio||!audioWasPlaying)){audioContext?.resume();presenterAudio.muted=!projectionVisible;presenterAudio.play().catch(()=>reportPresenter('Presenter audio could not play. Check the file and output device.'));}else if(!cue.playing)presenterAudio.pause();audioWasPlaying=cue.playing;}

  if (s.bg && s.bgType === 'video') {
    if (v.getAttribute('src') !== s.bg) { v.src = s.bg; v.play().catch(() => {}); }
    v.style.display = 'block'; document.body.style.backgroundImage = '';
  } else {
    v.style.display = 'none'; v.removeAttribute('src');
    document.body.style.backgroundImage = s.bg ? `url("${s.bg}")` : '';
  }
  document.body.style.backgroundSize=s.bgFit==='contain'?'contain':'cover';
  const textEl=document.getElementById('t');
  textEl.textContent = s.liveText || '';
  textEl.style.fontSize = (5.2 * (Number(s.outputScale) || 1)) + 'vw';
  const style=s.slideStyle||{};
  textEl.style.color=style.textColor||'#f6f1e7';
  document.body.style.backgroundColor=s.bgFit==='contain'?'#000':style.backColor||'#16131f';
  textEl.style.backgroundColor='transparent';
  textEl.style.fontFamily=style.fontFamily||'Georgia,serif';
  textEl.style.fontStyle=style.textItalic?'italic':'normal';textEl.style.webkitTextStroke=style.textOutline?'1px #000':'0px';textEl.style.lineHeight=String(Number(style.lineHeight)||1.3);
  textEl.style.textAlign=style.textAlign||'center';
  textEl.style.alignItems=style.textPosition==='top'?'flex-start':style.textPosition==='bottom'?'flex-end':'center';
  const sideMargin=Math.max(0,Math.min(20,Number.isFinite(Number(style.margin))?Number(style.margin):8));textEl.style.paddingLeft=(s.avatar?Math.max(36,sideMargin):sideMargin)+'vw';textEl.style.paddingRight=sideMargin+'vw';
  textEl.style.paddingTop=style.textPosition==='top'?'10vh':'6vh';
  textEl.style.paddingBottom=style.textPosition==='bottom'?'10vh':'6vh';
  textEl.style.fontWeight=style.textBold?'800':'600';
  textEl.style.textShadow=style.textShadow===false?'none':'0 2px 10px #000';
  textEl.style.maxWidth='100%';
  textEl.style.marginLeft=style.textWidth==='narrow'?'21vw':style.textWidth==='medium'?'10vw':'0';
  textEl.style.marginRight=style.textWidth==='narrow'?'21vw':style.textWidth==='medium'?'10vw':'0';
  document.getElementById('shade').style.opacity=String(Math.max(0,Math.min(80,Number(style.bgDim)||0))/100);
  textEl.classList.remove('fade-in');
  if(style.transitionStyle!=='none') requestAnimationFrame(()=>{textEl.classList.add('fade-in')});
  document.body.classList.toggle('av', !!s.avatar);
  if (av) av.setSpeaking(s.speaking);
});
</script><script src="./video-output.js"></script></body></html>
